spring.application.name=online-food-ordering-system

# Server Port (supports PORT for Render/Heroku and SERVER_PORT for custom environments)
server.port=${PORT:${SERVER_PORT:8080}}

# MongoDB Connection
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/food_ordering_db}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:FoodOrderingDefaultDevSecretKeyMustBe32BytesLongForHS256Security123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Initial Admin Bootstrap Configuration (Optional environment injection)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:System Administrator}
app.admin.phone=${ADMIN_PHONE:1234567890}
app.admin.address=${ADMIN_ADDRESS:123 Main Food Court, Suite 100}

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0
spring.mvc.static-path-pattern=/**

# JSON Formatting
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSZ
spring.jackson.time-zone=UTC
