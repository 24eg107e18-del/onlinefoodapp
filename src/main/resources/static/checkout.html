<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — CraveBite</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="header">
        <div class="nav-container">
            <a href="/index.html" class="brand-logo">
                <div class="brand-icon">🍕</div>
                <div class="brand-name">Crave<span>Bite</span></div>
            </a>
            <ul class="nav-links" id="nav-links"></ul>
            <div class="nav-actions" id="nav-user-actions"></div>
        </div>
    </header>

    <main class="main-content">
        <div class="section-header">
            <div>
                <h1 class="section-title">Checkout & Order Placement</h1>
                <p class="section-subtitle">Confirm your delivery details and choose your payment method</p>
            </div>
            <a href="/cart.html" style="font-weight: 600;">&larr; Back to Cart</a>
        </div>

        <div id="checkout-view">
            <div style="text-align: center; padding: 4rem; color: var(--text-muted);">
                Preparing checkout...
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            &copy; 2026 CraveBite Online Food Ordering System.
        </div>
    </footer>

    <script type="module">
        import { api, authStorage } from '/js/api.js';
        import { formatCurrency, showToast, refreshCartCount } from '/js/main.js';

        if (!authStorage.isAuthenticated()) {
            window.location.href = '/login.html';
        }

        const view = document.getElementById('checkout-view');

        async function initCheckout() {
            try {
                // Fetch Cart and User Profile
                const [cart, profile] = await Promise.all([
                    api.cart.get(),
                    api.users.getProfile()
                ]);

                if (!cart || !cart.items || cart.items.length === 0) {
                    view.innerHTML = `
                        <div class="card" style="text-align: center; padding: 3rem;">
                            <h3>Your cart is empty</h3>
                            <p style="margin: 1rem 0;">Please add items to your cart before proceeding to checkout.</p>
                            <a href="/menu.html" class="btn btn-primary">Browse Menu</a>
                        </div>
                    `;
                    return;
                }

                view.innerHTML = `
                    <div class="cart-layout">
                        <!-- Left: Delivery & Payment Details -->
                        <div>
                            <form id="checkout-form">
                                <div class="card">
                                    <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.25rem;">
                                        📍 1. Delivery Details
                                    </h2>
                                    <div class="form-group">
                                        <label class="form-label" for="checkout-name">Recipient Name</label>
                                        <input type="text" id="checkout-name" class="form-control" value="${profile.name || ''}" readonly style="background: var(--bg-subtle);">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="checkout-phone">Contact Phone</label>
                                        <input type="text" id="checkout-phone" class="form-control" value="${profile.phone || ''}" readonly style="background: var(--bg-subtle);">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="delivery-address">Delivery Address *</label>
                                        <textarea id="delivery-address" class="form-control" rows="3" required placeholder="House/Flat number, Street name, Landmark, City">${profile.address || ''}</textarea>
                                        <small style="color: var(--text-muted); display: block; margin-top: 0.35rem;">
                                            Please verify or enter the full delivery location for our courier.
                                        </small>
                                    </div>
                                </div>

                                <div class="card">
                                    <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.25rem;">
                                        💳 2. Payment Method
                                    </h2>
                                    <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                                        <!-- COD -->
                                        <label style="border: 1.5px solid var(--border-light); background: var(--bg-card); padding: 1rem 1.25rem; border-radius: var(--radius); display: flex; align-items: flex-start; gap: 1rem; cursor: pointer; transition: all 0.2s;" id="label-cod">
                                            <input type="radio" id="cod-radio" name="paymentMethod" value="CASH_ON_DELIVERY" checked style="width: 20px; height: 20px; accent-color: var(--primary); margin-top: 2px;">
                                            <div>
                                                <div style="font-weight: 700; color: var(--text-primary);">
                                                    Cash on Delivery (COD)
                                                </div>
                                                <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.2rem;">
                                                    Pay comfortably with cash or card upon delivery at your doorstep.
                                                </p>
                                            </div>
                                        </label>

                                        <!-- Card Sandbox -->
                                        <label style="border: 1.5px solid var(--border-light); background: var(--bg-card); padding: 1rem 1.25rem; border-radius: var(--radius); display: flex; align-items: flex-start; gap: 1rem; cursor: pointer; transition: all 0.2s;" id="label-card">
                                            <input type="radio" id="card-radio" name="paymentMethod" value="ONLINE_CARD" style="width: 20px; height: 20px; accent-color: var(--primary); margin-top: 2px;">
                                            <div style="flex: 1;">
                                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                                    <div style="font-weight: 700; color: var(--text-primary);">
                                                        Credit / Debit Card <span class="badge" style="background: var(--info-light); color: var(--info); font-size: 0.7rem; padding: 2px 6px;">Instant Sandbox</span>
                                                    </div>
                                                    <span style="font-size: 0.85rem; color: var(--text-muted);">Visa, MC, RuPay</span>
                                                </div>
                                                <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.2rem;">
                                                    Instant sandbox approval with simulated transaction confirmation.
                                                </p>
                                                <div id="card-details-box" style="display: none; margin-top: 1rem; padding: 1rem; background: var(--bg-subtle); border-radius: var(--radius);">
                                                    <div class="form-group" style="margin-bottom: 0.75rem;">
                                                        <label class="form-label" style="font-size: 0.8rem;">Card Number</label>
                                                        <input type="text" id="demo-card-number" class="form-control" placeholder="4532 8901 2345 6789" value="4532 8901 2345 6789">
                                                    </div>
                                                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                                                        <div>
                                                            <label class="form-label" style="font-size: 0.8rem;">Expiry</label>
                                                            <input type="text" id="demo-card-expiry" class="form-control" placeholder="MM/YY" value="12/28">
                                                        </div>
                                                        <div>
                                                            <label class="form-label" style="font-size: 0.8rem;">CVV</label>
                                                            <input type="password" id="demo-card-cvv" class="form-control" placeholder="•••" value="123" maxlength="4">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </label>

                                        <!-- UPI Sandbox -->
                                        <label style="border: 1.5px solid var(--border-light); background: var(--bg-card); padding: 1rem 1.25rem; border-radius: var(--radius); display: flex; align-items: flex-start; gap: 1rem; cursor: pointer; transition: all 0.2s;" id="label-upi">
                                            <input type="radio" id="upi-radio" name="paymentMethod" value="UPI" style="width: 20px; height: 20px; accent-color: var(--primary); margin-top: 2px;">
                                            <div style="flex: 1;">
                                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                                    <div style="font-weight: 700; color: var(--text-primary);">
                                                        UPI / QR Code <span class="badge" style="background: var(--info-light); color: var(--info); font-size: 0.7rem; padding: 2px 6px;">Instant Sandbox</span>
                                                    </div>
                                                    <span style="font-size: 0.85rem; color: var(--text-muted);">GPay, PhonePe, Paytm</span>
                                                </div>
                                                <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.2rem;">
                                                    Pay using any UPI VPA address or simulated QR code scan.
                                                </p>
                                                <div id="upi-details-box" style="display: none; margin-top: 1rem; padding: 1rem; background: var(--bg-subtle); border-radius: var(--radius);">
                                                    <label class="form-label" style="font-size: 0.8rem;">UPI ID / VPA</label>
                                                    <input type="text" id="demo-upi-id" class="form-control" placeholder="user@okhdfcbank" value="demo.student@okaxis">
                                                </div>
                                            </div>
                                        </label>
                                    </div>
                                </div>

                                <div id="checkout-error-msg" style="display: none; color: var(--danger); background: var(--danger-light); padding: 0.85rem; border-radius: var(--radius); margin-bottom: 1.5rem; font-size: 0.9rem;"></div>

                                <button type="submit" id="place-order-btn" class="btn btn-primary btn-lg" style="width: 100%;">
                                    Place Order (${formatCurrency(cart.totalAmount)}) &rarr;
                                </button>
                            </form>
                        </div>

                        <!-- Right: Order Items Snapshot -->
                        <div>
                            <div class="card">
                                <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border-light); padding-bottom: 0.75rem;">
                                    Order Summary (${cart.totalQuantity} items)
                                </h2>
                                <div style="max-height: 280px; overflow-y: auto; margin-bottom: 1.25rem;">
                                    ${cart.items.map(item => `
                                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0; border-bottom: 1px solid var(--border-light); font-size: 0.92rem;">
                                            <div>
                                                <strong>${item.quantity}x</strong> ${item.foodName}
                                            </div>
                                            <div style="font-weight: 600;">
                                                ${formatCurrency(item.lineTotal)}
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>

                                <div class="summary-row">
                                    <span>Subtotal</span>
                                    <span>${formatCurrency(cart.subtotal)}</span>
                                </div>
                                <div class="summary-row">
                                    <span>Estimated Tax (5%)</span>
                                    <span>${formatCurrency(cart.tax)}</span>
                                </div>
                                <div class="summary-row">
                                    <span>Delivery Fee</span>
                                    <span>${cart.deliveryFee > 0 ? formatCurrency(cart.deliveryFee) : '<strong style="color: var(--success);">FREE</strong>'}</span>
                                </div>
                                <div class="summary-row summary-total">
                                    <span>Total to Pay</span>
                                    <span style="color: var(--primary);">${formatCurrency(cart.totalAmount)}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                // Handle payment method toggling UI
                const paymentRadios = document.querySelectorAll('input[name="paymentMethod"]');
                const cardBox = document.getElementById('card-details-box');
                const upiBox = document.getElementById('upi-details-box');
                const labels = {
                    CASH_ON_DELIVERY: document.getElementById('label-cod'),
                    ONLINE_CARD: document.getElementById('label-card'),
                    UPI: document.getElementById('label-upi')
                };

                function updatePaymentUI(selected) {
                    cardBox.style.display = selected === 'ONLINE_CARD' ? 'block' : 'none';
                    upiBox.style.display = selected === 'UPI' ? 'block' : 'none';

                    Object.keys(labels).forEach(key => {
                        const lbl = labels[key];
                        if (key === selected) {
                            lbl.style.borderColor = 'var(--primary)';
                            lbl.style.background = 'var(--primary-light)';
                        } else {
                            lbl.style.borderColor = 'var(--border-light)';
                            lbl.style.background = 'var(--bg-card)';
                        }
                    });
                }

                paymentRadios.forEach(r => {
                    r.addEventListener('change', () => updatePaymentUI(r.value));
                });
                updatePaymentUI('CASH_ON_DELIVERY');

                // Handle order submission
                const form = document.getElementById('checkout-form');
                const errorBox = document.getElementById('checkout-error-msg');
                const placeOrderBtn = document.getElementById('place-order-btn');

                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    errorBox.style.display = 'none';

                    const address = document.getElementById('delivery-address').value.trim();
                    if (!address) {
                        errorBox.textContent = 'Please provide a valid delivery address.';
                        errorBox.style.display = 'block';
                        return;
                    }

                    const selectedMethod = document.querySelector('input[name="paymentMethod"]:checked')?.value || 'CASH_ON_DELIVERY';
                    let transactionId = null;

                    if (selectedMethod === 'ONLINE_CARD') {
                        const cardNum = document.getElementById('demo-card-number').value.trim();
                        if (!cardNum) {
                            errorBox.textContent = 'Please enter a valid simulated card number.';
                            errorBox.style.display = 'block';
                            return;
                        }
                        const randomSuffix = Math.floor(100000 + Math.random() * 900000);
                        transactionId = `TXN-CARD-${Date.now().toString().slice(-4)}${randomSuffix}`;
                    } else if (selectedMethod === 'UPI') {
                        const upiId = document.getElementById('demo-upi-id').value.trim();
                        if (!upiId) {
                            errorBox.textContent = 'Please enter a valid simulated UPI ID.';
                            errorBox.style.display = 'block';
                            return;
                        }
                        const randomSuffix = Math.floor(100000 + Math.random() * 900000);
                        transactionId = `TXN-UPI-${Date.now().toString().slice(-4)}${randomSuffix}`;
                    }

                    try {
                        placeOrderBtn.disabled = true;
                        placeOrderBtn.textContent = 'Processing Order...';

                        const orderResponse = await api.orders.place(address, selectedMethod, transactionId);
                        refreshCartCount();
                        showToast('Order placed successfully!', 'success');

                        setTimeout(() => {
                            window.location.href = `/order-confirmation.html?id=${orderResponse.id}`;
                        }, 800);
                    } catch (err) {
                        errorBox.textContent = err.message || 'Failed to place order. Please try again.';
                        errorBox.style.display = 'block';
                        placeOrderBtn.disabled = false;
                        placeOrderBtn.textContent = `Place Order (${formatCurrency(cart.totalAmount)})`;
                    }
                });
            } catch (err) {
                console.error(err);
                view.innerHTML = `
                    <div class="card" style="text-align: center; padding: 3rem; color: var(--danger);">
                        <h3>Error initializing checkout</h3>
                        <p>${err.message}</p>
                    </div>
                `;
            }
        }

        initCheckout();
    </script>
</body>
</html>
