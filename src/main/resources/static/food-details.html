<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Details — CraveBite</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="header">
        <div class="nav-container">
            <a href="/index.html" class="brand-logo">
                <div class="brand-icon">🍕</div>
                <div class="brand-name">Crave<span>Bite</span></div>
            </a>
            <ul class="nav-links" id="nav-links"></ul>
            <div class="nav-actions" id="nav-user-actions"></div>
        </div>
    </header>

    <main class="main-content">
        <div style="margin-bottom: 1.5rem;">
            <a href="/menu.html" style="display: inline-flex; align-items: center; gap: 0.4rem; font-weight: 600;">
                &larr; Back to Menu
            </a>
        </div>

        <div id="details-container">
            <div style="text-align: center; padding: 4rem; color: var(--text-muted);">
                Loading dish details...
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            &copy; 2026 CraveBite Online Food Ordering System.
        </div>
    </footer>

    <script type="module">
        import { api, authStorage } from '/js/api.js';
        import { formatCurrency, showToast, refreshCartCount } from '/js/main.js';

        const urlParams = new URLSearchParams(window.location.search);
        const foodId = urlParams.get('id');

        async function loadDetails() {
            const container = document.getElementById('details-container');
            if (!foodId) {
                container.innerHTML = `
                    <div class="card" style="text-align: center; padding: 3rem;">
                        <h3>No food item selected.</h3>
                        <p style="margin: 1rem 0;"><a href="/menu.html" class="btn btn-primary">Browse Menu</a></p>
                    </div>
                `;
                return;
            }

            try {
                const food = await api.foods.getById(foodId);
                let currentQty = 1;

                container.innerHTML = `
                    <div class="card" style="padding: 2.5rem;">
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2.5rem; align-items: center;">
                            <div>
                                <img src="${food.imageUrl || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&auto=format&fit=crop&q=80'}"
                                     alt="${food.name}"
                                     style="width: 100%; max-height: 380px; object-fit: cover; border-radius: var(--radius-lg); box-shadow: var(--shadow-md);"
                                     onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&auto=format&fit=crop&q=80'">
                            </div>
                            <div>
                                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem;">
                                    <span style="font-weight: 700; color: var(--primary); text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px;">
                                        ${food.categoryName || 'Chef Special'}
                                    </span>
                                    <span class="status-badge ${food.available ? 'badge-available' : 'badge-unavailable'}">
                                        ${food.available ? 'In Stock' : 'Out of Stock'}
                                    </span>
                                </div>

                                <h1 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 0.75rem;">${food.name}</h1>
                                
                                <div style="font-size: 1.85rem; font-weight: 800; color: var(--text-primary); margin-bottom: 1.5rem;">
                                    ${formatCurrency(food.price)}
                                </div>

                                <p style="font-size: 1.05rem; color: var(--text-secondary); line-height: 1.7; margin-bottom: 2rem;">
                                    ${food.description || 'Cooked freshly with carefully chosen ingredients, gourmet seasonings, and pure passion.'}
                                </p>

                                ${food.available ? `
                                <div style="display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem; flex-wrap: wrap;">
                                    <div class="quantity-controls">
                                        <button class="quantity-btn" id="qty-dec">&minus;</button>
                                        <div class="quantity-value" id="qty-val">1</div>
                                        <button class="quantity-btn" id="qty-inc">&plus;</button>
                                    </div>
                                    <div style="font-size: 1.1rem; font-weight: 700;">
                                        Subtotal: <span id="item-subtotal-display" style="color: var(--primary);">${formatCurrency(food.price)}</span>
                                    </div>
                                </div>

                                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                                    <button class="btn btn-primary btn-lg" id="add-to-cart-submit" style="flex: 1; min-width: 200px;">
                                        Add to Cart
                                    </button>
                                    <a href="/cart.html" class="btn btn-secondary btn-lg">View Cart</a>
                                </div>
                                ` : `
                                <div style="background: var(--bg-subtle); padding: 1rem; border-radius: var(--radius); color: var(--text-muted); font-weight: 600;">
                                    This item is currently sold out. Please explore our other menu items.
                                </div>
                                `}
                            </div>
                        </div>
                    </div>
                `;

                if (food.available) {
                    const decBtn = document.getElementById('qty-dec');
                    const incBtn = document.getElementById('qty-inc');
                    const qtyVal = document.getElementById('qty-val');
                    const subtotalDisplay = document.getElementById('item-subtotal-display');
                    const addBtn = document.getElementById('add-to-cart-submit');

                    const updateSubtotal = () => {
                        qtyVal.textContent = currentQty;
                        subtotalDisplay.textContent = formatCurrency(food.price * currentQty);
                    };

                    decBtn.addEventListener('click', () => {
                        if (currentQty > 1) {
                            currentQty--;
                            updateSubtotal();
                        }
                    });

                    incBtn.addEventListener('click', () => {
                        currentQty++;
                        updateSubtotal();
                    });

                    addBtn.addEventListener('click', async () => {
                        if (!authStorage.isAuthenticated()) {
                            showToast('Please log in to add items to your cart.', 'info');
                            setTimeout(() => window.location.href = '/login.html', 1000);
                            return;
                        }

                        try {
                            addBtn.disabled = true;
                            addBtn.textContent = 'Adding to cart...';
                            await api.cart.add(food.id, currentQty);
                            showToast(`Added ${currentQty} x "${food.name}" to cart!`, 'success');
                            refreshCartCount();
                        } catch (err) {
                            showToast(err.message || 'Failed to add item', 'error');
                        } finally {
                            addBtn.disabled = false;
                            addBtn.textContent = 'Add to Cart';
                        }
                    });
                }
            } catch (err) {
                container.innerHTML = `
                    <div class="card" style="text-align: center; padding: 3rem; color: var(--danger);">
                        <h3>Failed to load dish details.</h3>
                        <p>${err.message}</p>
                        <p style="margin-top: 1rem;"><a href="/menu.html" class="btn btn-outline">Back to Menu</a></p>
                    </div>
                `;
            }
        }

        loadDetails();
    </script>
</body>
</html>
