<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders — CraveBite</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="header">
        <div class="nav-container">
            <a href="/index.html" class="brand-logo">
                <div class="brand-icon">🍕</div>
                <div class="brand-name">Crave<span>Bite</span></div>
            </a>
            <ul class="nav-links" id="nav-links"></ul>
            <div class="nav-actions" id="nav-user-actions"></div>
        </div>
    </header>

    <main class="main-content">
        <div class="section-header">
            <div>
                <h1 class="section-title">My Orders History</h1>
                <p class="section-subtitle">Track your ongoing deliveries and view past receipts</p>
            </div>
            <a href="/menu.html" class="btn btn-primary btn-sm">+ Order More Food</a>
        </div>

        <div id="orders-list-view">
            <div style="text-align: center; padding: 4rem; color: var(--text-muted);">
                Loading your orders...
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            &copy; 2026 CraveBite Online Food Ordering System.
        </div>
    </footer>

    <script type="module">
        import { api, authStorage } from '/js/api.js';
        import { formatCurrency, formatDate, showToast } from '/js/main.js';

        if (!authStorage.isAuthenticated()) {
            window.location.href = '/login.html';
        }

        const view = document.getElementById('orders-list-view');

        async function loadOrders() {
            try {
                const orders = await api.orders.getMyOrders();

                if (!orders || orders.length === 0) {
                    view.innerHTML = `
                        <div class="card" style="text-align: center; padding: 4rem;">
                            <div style="font-size: 3.5rem; margin-bottom: 1rem;">📦</div>
                            <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem;">No Orders Placed Yet</h2>
                            <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">You haven't ordered any delicious meals yet. Start exploring now!</p>
                            <a href="/menu.html" class="btn btn-primary btn-lg">Browse Menu & Order</a>
                        </div>
                    `;
                    return;
                }

                view.innerHTML = orders.map(order => `
                    <div class="card" style="margin-bottom: 1.5rem; transition: var(--transition);">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; border-bottom: 1px solid var(--border-light); padding-bottom: 1rem; margin-bottom: 1.25rem;">
                            <div>
                                <div style="font-weight: 700; font-size: 1.15rem; color: var(--text-primary);">
                                    Order #${order.id}
                                </div>
                                <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.2rem;">
                                    Placed on ${formatDate(order.orderDate)}
                                </div>
                            </div>

                            <div style="display: flex; align-items: center; gap: 0.75rem;">
                                <span class="status-badge status-${order.orderStatus}">
                                    ${order.orderStatus.replace(/_/g, ' ')}
                                </span>
                                <span class="status-badge status-${order.paymentStatus}">
                                    ${order.paymentStatus}
                                </span>
                            </div>
                        </div>

                        <!-- Item list preview -->
                        <div style="margin-bottom: 1.25rem;">
                            ${order.items.map(item => `
                                <div style="display: flex; justify-content: space-between; font-size: 0.92rem; padding: 0.35rem 0;">
                                    <span><strong>${item.quantity}x</strong> ${item.foodName}</span>
                                    <span style="color: var(--text-secondary);">${formatCurrency(item.lineTotal)}</span>
                                </div>
                            `).join('')}
                        </div>

                        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; border-top: 1px solid var(--border-light); padding-top: 1rem;">
                            <div>
                                <span style="font-size: 0.88rem; color: var(--text-muted);">Total Amount:</span>
                                <span style="font-size: 1.25rem; font-weight: 800; color: var(--primary); margin-left: 0.35rem;">
                                    ${formatCurrency(order.totalAmount)}
                                </span>
                            </div>

                            <div style="display: flex; gap: 0.75rem;">
                                <a href="/order-tracking.html?id=${order.id}" class="btn btn-outline btn-sm">
                                    🚚 Track Status
                                </a>
                                <a href="/order-confirmation.html?id=${order.id}" class="btn btn-secondary btn-sm">
                                    View Receipt
                                </a>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                view.innerHTML = `
                    <div class="card" style="text-align: center; padding: 3rem; color: var(--danger);">
                        <h3>Error loading orders</h3>
                        <p>${err.message}</p>
                    </div>
                `;
            }
        }

        loadOrders();
    </script>
</body>
</html>
