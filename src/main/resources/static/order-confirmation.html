<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed — CraveBite</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="header">
        <div class="nav-container">
            <a href="/index.html" class="brand-logo">
                <div class="brand-icon">🍕</div>
                <div class="brand-name">Crave<span>Bite</span></div>
            </a>
            <ul class="nav-links" id="nav-links"></ul>
            <div class="nav-actions" id="nav-user-actions"></div>
        </div>
    </header>

    <main class="main-content" style="max-width: 760px;">
        <div id="confirmation-view">
            <div style="text-align: center; padding: 4rem; color: var(--text-muted);">
                Verifying order confirmation...
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            &copy; 2026 CraveBite Online Food Ordering System.
        </div>
    </footer>

    <script type="module">
        import { api, authStorage } from '/js/api.js';
        import { formatCurrency, formatDate, showToast } from '/js/main.js';

        if (!authStorage.isAuthenticated()) {
            window.location.href = '/login.html';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');
        const view = document.getElementById('confirmation-view');

        async function loadConfirmation() {
            if (!orderId) {
                view.innerHTML = `
                    <div class="card" style="text-align: center; padding: 3rem;">
                        <h2>No order ID specified.</h2>
                        <p style="margin: 1rem 0;"><a href="/my-orders.html" class="btn btn-primary">Go to My Orders</a></p>
                    </div>
                `;
                return;
            }

            try {
                const order = await api.orders.getById(orderId);

                view.innerHTML = `
                    <div class="card" style="text-align: center; padding: 2.5rem 2rem; margin-bottom: 2rem;">
                        <div style="width: 72px; height: 72px; border-radius: 50%; background: var(--success-light); color: var(--success); font-size: 2.5rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem auto;">
                            ✓
                        </div>
                        <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; color: var(--text-primary);">
                            Order Placed Successfully!
                        </h1>
                        <p style="color: var(--text-secondary); font-size: 1rem; margin-bottom: 1.5rem;">
                            Thank you for your order, <strong>${order.customerName}</strong>. Our kitchen has received your ticket and is preparing your meal.
                        </p>
                        
                        <div style="display: inline-flex; align-items: center; gap: 0.5rem; background: var(--bg-subtle); padding: 0.5rem 1rem; border-radius: var(--radius-full); font-size: 0.95rem; font-weight: 600; margin-bottom: 2rem;">
                            <span>Order Reference:</span>
                            <span style="color: var(--primary); font-family: monospace;">#${order.id}</span>
                        </div>

                        <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
                            <a href="/order-tracking.html?id=${order.id}" class="btn btn-primary btn-lg">
                                🚀 Track Live Status
                            </a>
                            <a href="/my-orders.html" class="btn btn-secondary btn-lg">
                                View Order History
                            </a>
                        </div>
                    </div>

                    <div class="card">
                        <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border-light); padding-bottom: 0.75rem;">
                            Order Breakdown
                        </h2>

                        <div style="margin-bottom: 1.5rem;">
                            ${order.items.map(item => `
                                <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0; border-bottom: 1px solid var(--border-light);">
                                    <div>
                                        <strong>${item.quantity}x</strong> ${item.foodName}
                                        <div style="color: var(--text-muted); font-size: 0.85rem;">${formatCurrency(item.unitPrice)} each</div>
                                    </div>
                                    <div style="font-weight: 700;">
                                        ${formatCurrency(item.lineTotal)}
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="summary-row">
                            <span>Placed On</span>
                            <span>${formatDate(order.orderDate)}</span>
                        </div>
                        <div class="summary-row">
                            <span>Delivery Address</span>
                            <span>${order.deliveryAddress}</span>
                        </div>
                        <div class="summary-row">
                            <span>Payment Method</span>
                            <span>${order.paymentMethod} (${order.paymentStatus})</span>
                        </div>
                        <div class="summary-row summary-total">
                            <span>Total Paid / Due</span>
                            <span style="color: var(--primary);">${formatCurrency(order.totalAmount)}</span>
                        </div>
                    </div>
                `;
            } catch (err) {
                console.error(err);
                view.innerHTML = `
                    <div class="card" style="text-align: center; padding: 3rem; color: var(--danger);">
                        <h3>Error fetching order details</h3>
                        <p>${err.message}</p>
                        <p style="margin-top: 1rem;"><a href="/my-orders.html" class="btn btn-primary">My Orders</a></p>
                    </div>
                `;
            }
        }

        loadConfirmation();
    </script>
</body>
</html>
